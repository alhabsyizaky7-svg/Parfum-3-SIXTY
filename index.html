<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 SIXTY Parfum - Video Showcase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            height: 100dvh;
        }
        .snap-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 6s linear infinite;
        }
    </style>
</head>
<body class="bg-black text-white select-none">

    <!-- Top Navigation Tabs -->
    <header class="fixed top-0 left-0 right-0 z-40 flex justify-center items-center pt-4 pb-2 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-auto">
        <div class="flex items-center space-x-5 text-base font-semibold">
            <button class="text-zinc-400 hover:text-white transition cursor-pointer">Mengikuti</button>
            <span class="text-zinc-600 font-light">|</span>
            <button class="text-white border-b-2 border-white pb-0.5 transition cursor-pointer">Untuk Anda</button>
        </div>
        <button onclick="window.open('https://s.id/parfum3sixty', '_blank')" class="absolute right-4 bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-amber-500/30 transition">
            Beli Sekarang
        </button>
    </header>

    <!-- Main Vertical Video Feed Container -->
    <main id="video-feed" class="snap-container no-scrollbar">
        <!-- Video items will be injected by JavaScript -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-black/90 backdrop-blur-md border-t border-zinc-900 pb-safe pt-2 px-6 flex justify-around items-center h-14">
        <button onclick="showToast('Beranda')" class="flex flex-col items-center text-white cursor-pointer nav-btn">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] mt-0.5 font-medium">Beranda</span>
        </button>
        <button onclick="showToast('Katalog Parfum')" class="flex flex-col items-center text-zinc-400 hover:text-white cursor-pointer nav-btn">
            <i data-lucide="compass" class="w-6 h-6"></i>
            <span class="text-[10px] mt-0.5 font-medium">Koleksi</span>
        </button>
        <button onclick="window.open('https://s.id/parfum3sixty', '_blank')" class="relative flex items-center justify-center w-11 h-8 bg-gradient-to-r from-amber-500 to-amber-600 rounded-xl cursor-pointer shadow-lg hover:opacity-90 transition">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-black stroke-[2.5]"></i>
        </button>
        <button onclick="showToast('Kotak Masuk')" class="flex flex-col items-center text-zinc-400 hover:text-white cursor-pointer nav-btn">
            <i data-lucide="message-square" class="w-6 h-6"></i>
            <span class="text-[10px] mt-0.5 font-medium">Pesan</span>
        </button>
        <button onclick="showToast('Profil 3 SIXTY')" class="flex flex-col items-center text-zinc-400 hover:text-white cursor-pointer nav-btn">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] mt-0.5 font-medium">Profil</span>
        </button>
    </nav>

    <!-- Comments Drawer Overlay -->
    <div id="comments-drawer" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex flex-col justify-end translate-y-full transition-transform duration-300 ease-out">
        <div class="bg-zinc-900 rounded-t-3xl max-h-[75vh] h-[75vh] flex flex-col border-t border-zinc-800 shadow-2xl">
            <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
                <h3 id="comments-title" class="text-sm font-semibold text-zinc-200">Komentar</h3>
                <button onclick="closeComments()" class="text-zinc-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar">
                <!-- Comments populated dynamically -->
            </div>
            <div class="p-3 bg-zinc-950 border-t border-zinc-800 flex items-center space-x-3">
                <input id="comment-input" type="text" placeholder="Tanyakan seputar aroma parfum..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-600">
                <button onclick="postComment()" class="bg-amber-500 hover:opacity-90 text-black p-2.5 rounded-full flex items-center justify-center transition">
                    <i data-lucide="send" class="w-4 h-4 font-bold"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex flex-col justify-end translate-y-full transition-transform duration-300 ease-out">
        <div class="bg-zinc-900 rounded-t-3xl p-6 border-t border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-semibold text-zinc-300">Bagikan Tautan Produk</h3>
                <button onclick="closeShareModal()" class="text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="grid grid-cols-4 gap-4 mb-6 text-center">
                <button onclick="shareAction('WhatsApp')" class="flex flex-col items-center space-y-2 group">
                    <div class="w-12 h-12 bg-emerald-600 rounded-full flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition"><i data-lucide="message-circle" class="w-6 h-6"></i></div>
                    <span class="text-xs text-zinc-400">WhatsApp</span>
                </button>
                <button onclick="shareAction('Instagram')" class="flex flex-col items-center space-y-2 group">
                    <div class="w-12 h-12 bg-gradient-to-tr from-yellow-500 via-pink-600 to-purple-600 rounded-full flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition"><i data-lucide="instagram" class="w-6 h-6"></i></div>
                    <span class="text-xs text-zinc-400">Instagram</span>
                </button>
                <button onclick="copyLink()" class="flex flex-col items-center space-y-2 group">
                    <div class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition border border-zinc-700"><i data-lucide="link" class="w-6 h-6"></i></div>
                    <span class="text-xs text-zinc-400">Salin Link</span>
                </button>
                <button onclick="window.open('https://s.id/parfum3sixty', '_blank')" class="flex flex-col items-center space-y-2 group">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center text-black shadow-lg group-hover:scale-105 transition font-bold"><i data-lucide="shopping-bag" class="w-6 h-6"></i></div>
                    <span class="text-xs text-zinc-400">Order</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-amber-500/90 text-black font-medium text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300">
        Berhasil disalin!
    </div>

    <!-- JavaScript Logic -->
    <script>
        const videos = [
            {
                id: 1,
                author: "3sixty.official",
                name: "3 SIXTY Parfum",
                avatar: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=150&auto=format&fit=crop&q=80",
                verified: true,
                description: "Rasakan kemewahan aroma eksklusif WHITE ORCHID dari 3 SIXTY. Tahan seharian, tingkatkan percaya dirimu! ✨ Promo spesial Rp40.000 (Normal Rp45.000). Pesan di s.id/parfum3sixty 🛍️ #3SixtyParfum #WhiteOrchid #ParfumPriaWanita",
                music: "Original Sound - 3 SIXTY Fragrance",
                likes: 18400,
                comments: 420,
                shares: 1530,
                bookmarks: 5600,
                liked: false,
                bookmarked: false,
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-perfume-bottle-falling-into-water-with-bubbles-43542-large.mp4"
            },
            {
                id: 2,
                author: "3sixty.official",
                name: "3 SIXTY Parfum",
                avatar: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=150&auto=format&fit=crop&q=80",
                verified: true,
                description: "Varian BLACK CODE untuk kesan maskulin, misterius, dan elegan di setiap aktivitas malammu. 🔥 Dapatkan diskon spesial hari ini via s.id/parfum3sixty 🖤 #BlackCode #ParfumTahanLama",
                music: "Luxury Night Beats - 3 SIXTY",
                likes: 12900,
                comments: 295,
                shares: 980,
                bookmarks: 3400,
                liked: false,
                bookmarked: false,
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-spraying-perfume-close-up-43543-large.mp4"
            },
            {
                id: 3,
                author: "3sixty.official",
                name: "3 SIXTY Parfum",
                avatar: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=150&auto=format&fit=crop&q=80",
                verified: true,
                description: "AR-ONE & RS-ONE pilihan tepat untuk kesegaran harian berkarakter mewah. Kunjungi s.id/parfum3sixty untuk klaim promonya sekarang! 💎 #3SixtyFragrance #ArOne #RsOne",
                music: "Fresh Summer Vibe - TikTok",
                likes: 21500,
                comments: 610,
                shares: 2400,
                bookmarks: 8100,
                liked: false,
                bookmarked: false,
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-perfume-bottle-on-a-mirror-surface-with-lights-41586-large.mp4"
            }
        ];

        let activeVideoId = 1;

        function renderFeed() {
            const feedContainer = document.getElementById('video-feed');
            feedContainer.innerHTML = videos.map((v) => `
                <div class="snap-item relative bg-black flex items-center justify-center overflow-hidden" data-id="${v.id}">
                    <video class="absolute inset-0 w-full h-full object-cover cursor-pointer" 
                           src="${v.videoUrl}" 
                           loop 
                           playsinline 
                           webkit-playsinline
                           onclick="togglePlayPause(this)"
                           ontimeupdate="updateProgress(this, ${v.id})">
                    </video>

                    <div id="play-indicator-${v.id}" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                        <div class="w-16 h-16 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center text-white">
                            <i data-lucide="play" class="w-8 h-8 fill-white ml-1"></i>
                        </div>
                    </div>

                    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/80 pointer-events-none"></div>

                    <!-- Right Action Sidebar -->
                    <div class="absolute right-3 bottom-20 z-20 flex flex-col items-center space-y-4">
                        <div class="relative mb-2">
                            <img src="${v.avatar}" class="w-12 h-12 rounded-full border-2 border-amber-500 object-cover shadow-md" alt="${v.name}">
                            <button onclick="window.open('https://s.id/parfum3sixty', '_blank')" class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-amber-500 text-black w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold shadow hover:scale-110 transition cursor-pointer">
                                <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
                            </button>
                        </div>

                        <!-- Like Button -->
                        <button onclick="handleLike(${v.id})" class="flex flex-col items-center group cursor-pointer">
                            <div id="like-btn-${v.id}" class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-white transition transform group-active:scale-90 ${v.liked ? 'text-rose-500' : ''}">
                                <i data-lucide="heart" class="w-7 h-7 ${v.liked ? 'fill-rose-500 text-rose-500' : ''}"></i>
                            </div>
                            <span id="like-count-${v.id}" class="text-xs font-semibold mt-1 drop-shadow">${formatNumber(v.likes)}</span>
                        </button>

                        <!-- Comments Button -->
                        <button onclick="openComments(${v.id})" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-white transition transform group-active:scale-90">
                                <i data-lucide="message-circle" class="w-7 h-7 fill-black/20"></i>
                            </div>
                            <span class="text-xs font-semibold mt-1 drop-shadow">${formatNumber(v.comments)}</span>
                        </button>

                        <!-- Bookmark Button -->
                        <button onclick="handleBookmark(${v.id})" class="flex flex-col items-center group cursor-pointer">
                            <div id="bookmark-btn-${v.id}" class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-white transition transform group-active:scale-90 ${v.bookmarked ? 'text-amber-400' : ''}">
                                <i data-lucide="bookmark" class="w-7 h-7 ${v.bookmarked ? 'fill-amber-400 text-amber-400' : ''}"></i>
                            </div>
                            <span id="bookmark-count-${v.id}" class="text-xs font-semibold mt-1 drop-shadow">${formatNumber(v.bookmarks)}</span>
                        </button>

                        <!-- Share Button -->
                        <button onclick="openShareModal(${v.id})" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-white transition transform group-active:scale-90">
                                <i data-lucide="share-2" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-semibold mt-1 drop-shadow">${formatNumber(v.shares)}</span>
                        </button>

                        <!-- Rotating Sound Disc -->
                        <div class="w-10 h-10 rounded-full bg-zinc-900 border-2 border-amber-500/60 overflow-hidden shadow-lg animate-spin-slow mt-2 flex items-center justify-center">
                            <img src="${v.avatar}" class="w-6 h-6 rounded-full object-cover">
                        </div>
                    </div>

                    <!-- Bottom Caption Info -->
                    <div class="absolute left-4 right-20 bottom-18 z-20 pointer-events-auto">
                        <div class="flex items-center space-x-2 mb-1.5">
                            <span class="font-bold text-base text-white tracking-wide">@${v.author}</span>
                            ${v.verified ? '<span class="bg-amber-500 text-black rounded-full p-0.5 flex items-center justify-center"><i data-lucide="check" class="w-3 h-3 stroke-[3]"></i></span>' : ''}
                        </div>
                        <p class="text-sm text-zinc-100 line-clamp-2 leading-snug mb-3 drop-shadow">${v.description}</p>
                        
                        <!-- Order Button Shortcut -->
                        <a href="https://s.id/parfum3sixty" target="_blank" class="inline-flex items-center space-x-2 text-xs font-semibold text-black bg-amber-400 hover:bg-amber-300 py-1.5 px-3 rounded-full shadow-md transition">
                            <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                            <span>Order via s.id/parfum3sixty</span>
                        </a>
                    </div>

                    <div class="absolute bottom-14 left-0 right-0 h-0.5 bg-white/20 z-30">
                        <div id="progress-${v.id}" class="h-full bg-amber-400 w-0 transition-all duration-75"></div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            setupIntersectionObserver();
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                        activeVideoId = parseInt(entry.target.getAttribute('data-id'));
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.snap-item').forEach(item => observer.observe(item));
        }

        function togglePlayPause(videoEl) {
            const container = videoEl.closest('.snap-item');
            const videoId = container.getAttribute('data-id');
            const indicator = document.getElementById(`play-indicator-${videoId}`);

            if (videoEl.paused) {
                videoEl.play();
                indicator.style.opacity = '0';
            } else {
                videoEl.pause();
                indicator.style.opacity = '1';
                setTimeout(() => { indicator.style.opacity = '0'; }, 500);
            }
        }

        function updateProgress(videoEl, id) {
            const progress = document.getElementById(`progress-${id}`);
            if (progress && videoEl.duration) {
                const percent = (videoEl.currentTime / videoEl.duration) * 100;
                progress.style.width = `${percent}%`;
            }
        }

        function handleLike(id) {
            const video = videos.find(v => v.id === id);
            if (!video) return;
            video.liked = !video.liked;
            video.liked ? video.likes++ : video.likes--;

            const btn = document.getElementById(`like-btn-${id}`);
            const count = document.getElementById(`like-count-${id}`);

            if (video.liked) {
                btn.classList.add('text-rose-500');
                btn.innerHTML = `<i data-lucide="heart" class="w-7 h-7 fill-rose-500 text-rose-500"></i>`;
            } else {
                btn.classList.remove('text-rose-500');
                btn.innerHTML = `<i data-lucide="heart" class="w-7 h-7"></i>`;
            }
            count.textContent = formatNumber(video.likes);
            lucide.createIcons();
        }

        function handleBookmark(id) {
            const video = videos.find(v => v.id === id);
            if (!video) return;
            video.bookmarked = !video.bookmarked;
            video.bookmarked ? video.bookmarks++ : video.bookmarks--;

            const btn = document.getElementById(`bookmark-btn-${id}`);
            const count = document.getElementById(`bookmark-count-${id}`);

            if (video.bookmarked) {
                btn.classList.add('text-amber-400');
                btn.innerHTML = `<i data-lucide="bookmark" class="w-7 h-7 fill-amber-400 text-amber-400"></i>`;
            } else {
                btn.classList.remove('text-amber-400');
                btn.innerHTML = `<i data-lucide="bookmark" class="w-7 h-7"></i>`;
            }
            count.textContent = formatNumber(video.bookmarks);
            lucide.createIcons();
        }

        const mockComments = [
            { user: "dinda_parfum", text: "White Orchid wanginya mewah banget tahan lama! Sukses terus 3 SIXTY 🔥", time: "1j lalu", likes: 24 },
            { user: "rizky_store", text: "Kak kalau ambil paket reseller dapet potongan harga berapa?", time: "3j lalu", likes: 15 },
            { user: "sintia_mey", text: "Udah order lewat s.id/parfum3sixty, semoga cepet sampai ya kak!", time: "5j lalu", likes: 8 }
        ];

        function openComments(id) {
            const video = videos.find(v => v.id === id);
            document.getElementById('comments-title').textContent = `${formatNumber(video.comments)} Komentar`;
            
            const list = document.getElementById('comments-list');
            list.innerHTML = mockComments.map(c => `
                <div class="flex items-start space-x-3">
                    <div class="w-9 h-9 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs text-amber-400 uppercase">${c.user[0]}</div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-zinc-400">@${c.user}</span>
                            <span class="text-[10px] text-zinc-500">${c.time}</span>
                        </div>
                        <p class="text-sm text-zinc-200 mt-0.5">${c.text}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('comments-drawer').classList.remove('translate-y-full');
            lucide.createIcons();
        }

        function closeComments() {
            document.getElementById('comments-drawer').classList.add('translate-y-full');
        }

        function postComment() {
            const input = document.getElementById('comment-input');
            if (!input.value.trim()) return;

            mockComments.unshift({
                user: "anda",
                text: input.value,
                time: "Baru saja",
                likes: 0
            });

            input.value = "";
            openComments(activeVideoId);
        }

        function openShareModal(id) {
            document.getElementById('share-modal').classList.remove('translate-y-full');
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.add('translate-y-full');
        }

        function shareAction(platform) {
            showToast(`Membagikan ke ${platform}!`);
            closeShareModal();
        }

        function copyLink() {
            navigator.clipboard.writeText("https://s.id/parfum3sixty");
            showToast('Link s.id/parfum3sixty disalin!');
            closeShareModal();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderFeed();
        });
    </script>
</body>
</html>
